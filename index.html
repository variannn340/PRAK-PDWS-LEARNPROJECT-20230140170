<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style/global.css">

</head>
<body>

   <header>
    <nav class="navbar navbar-dark bg-primary shadow-sm">
      <div class="container">
        <span class="navbar-brand mb-0 h1">Formulir Pendaftaran Seminar</span>
      </div>
    </nav>
  </header>

    <main class="py-5">
    <div class="container">
       <div class="row justify-content-center">
        <div class="col-12 col-lg-9 col-xl-8">
      <section>
            <h2 class="mb-4 border-start border-4 border-primary ps-3">Data Peserta</h2>

       <div class="card shadow-sm">
              <div class="card-body p-4 p-md-5">
 
                <!-- action mengarah ke thanks.html sebagai halaman konfirmasi -->
                <form action="thanks.html" method="get">

         <div class="row g-3">
 
                    <div class="col-12 col-md-6">
                      <label for="nama" class="form-label">Nama Lengkap</label>
                      <input type="text" class="form-control" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
                    </div>
 
                    <div class="col-12 col-md-6">
                      <label for="email" class="form-label">Email</label>
                      <input type="email" class="form-control" id="email" name="email" placeholder="nama@email.com" required>
                    </div>

          <div class="col-12 col-md-6">
                      <label for="nomor-telepon" class="form-label">Nomor Telepon</label>
                      <input type="number" class="form-control" id="nomor-telepon" name="nomor telepon" placeholder="078222122222" required>
                    </div>

         <div class="col-12 col-md-6">
                      <label for="tanggal-lahir" class="form-label">Tanggal Lahir</label>
                      <input type="date" class="form-control" id="tanggal-lahir" name="tanggal lahir" required>
                    </div>
        
                    <div class="col-12 col-md-6">
                      <label for="nim" class="form-label">NIM</label>
                      <input type="text" class="form-control" id="nim" name="nim" placeholder="Contoh: 20210001" required>
                    </div>

         <div class="col-12 col-md-6">
                      <label for="prodi" class="form-label">Program Studi</label>
                      <select id="prodi" name="prodi" class="form-select" required>
                        <option value="" selected disabled>-- Pilih Program Studi --</option>
                        <option value="ti">Teknologi Informasi</option>
                        <option value="if">Informatika</option>
                        <option value="si">Sistem Informasi</option>
                      </select>
                    </div>
         <div class="col-12">
                      <label class="form-label d-block">Jenis Kelamin</label>
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="pria" name="gender" value="pria" required>
                        <label class="form-check-label" for="pria">Pria</label>
                      </div>
                      <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" id="wanita" name="gender" value="wanita" required>
                        <label class="form-check-label" for="wanita">Wanita</label>
                      </div>
                    </div>

            <!-- Pesan: full width -->
                    <div class="col-12">
                      <label for="pesan" class="form-label">Pesan / Pertanyaan</label>
                      <textarea id="pesan" name="pesan" class="form-control" rows="4" placeholder="Tulis pesan Anda di sini..." required></textarea>
                    </div>
 
                    <!-- Persetujuan -->
                    <div class="col-12">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="setuju" name="setuju" required>
                        <label class="form-check-label" for="setuju">
                          Saya menyetujui syarat dan ketentuan
                        </label>
                      </div>
                    </div>
 
                    <!-- Tombol submit -->
                    <div class="col-12 d-grid">
                      <button type="submit" class="btn btn-primary btn-lg">Daftar Sekarang</button>
                    </div>
 
                  </div>
                </form>
 
              </div>
            </div>
 
          </section>
 
        </div>
      </div>
 
    </div>
  </main>
 
  <!-- Footer -->
  <footer class="bg-light border-top py-3">
    <div class="container text-center">
      <p class="mb-0 text-muted small">&copy; 2026 Program Studi S1 Teknologi Informasi</p>
    </div>
  </footer>
 
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
 


    </section>
  </main>

  <footer>
    <p>&copy; 2026 Program Studi S1 Teknologi Informasi</p>
  </footer>

</body>
</html>
